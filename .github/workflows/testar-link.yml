name: testar-link
# Só testa para onde um link leva (não posta nada). Actions > testar-link > Run workflow.
on:
  workflow_dispatch:
    inputs:
      links:
        description: "links separados por espaço"
        default: ""
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          LINKS: ${{ github.event.inputs.links }}
        run: python -m promo_bot.lojas_extra $LINKS
