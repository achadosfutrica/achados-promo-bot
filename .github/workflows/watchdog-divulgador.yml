name: watchdog-divulgador
# De 2 em 2 horas, confere se os bots do Divulgador (divulgadorinteligentebot e os outros 2) ficaram travados
# numa pergunta sem resposta (ex.: apos uma execucao do robo principal cair no meio) e destrava com /cancelar.
# NUNCA mexe se parecer promocao em andamento (so age quando a ultima mensagem esta ha mais de 20 min parada).
# Roda sozinho, sem depender do Claude. Para desligar: Actions > watchdog-divulgador > ... > Disable workflow.
# 27/11: o agendamento foi DESLIGADO. Ele usava a mesma sessao do Telegram (TG_SESSION) ao mesmo tempo que o
# promo-bot, que fica ligado o dia todo: duas conexoes com a mesma sessao quebram as duas. O destravamento
# agora e feito dentro do proprio promo-bot (bot que falha sai do rodizio por 5 min; execucao travada reinicia
# sozinha). Ainda da para rodar este a mao: Actions > watchdog-divulgador > Run workflow.
on:
  workflow_dispatch: {}

concurrency:
  group: watchdog-divulgador
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Checar e destravar
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -m promo_bot.watchdog_divulgador
