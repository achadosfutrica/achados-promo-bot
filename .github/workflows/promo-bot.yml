name: promo-bot
# DESATIVADO: só roda manualmente (workflow_dispatch). Para automatizar, remova o '#' das 2 linhas do cron.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "off | dry | test | live"
        default: "dry"
  # schedule:
  #   - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: promo-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          PROMO_MODE: ${{ github.event.inputs.mode || vars.PROMO_MODE || 'off' }}
        run: python -m promo_bot.main
      - name: Salvar estado
        if: always()
        run: |
          mkdir -p state
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add state/estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estado" && git pull --rebase && git push)
