name: promo-bot
# ATIVO: de dia fica ligado (vigia de cupons, ~5h30 por execucao; a da fila assume em seguida). Madrugada: a cada 30 min. Para parar: crie a variável PROMO_MODE = off (Settings > Secrets and variables > Actions > Variables).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "off | dry | test | live (vazio = usa o config.yaml / PROMO_MODE: o robo se relanca sozinho sem informar modo)"
        default: ""
      link:
        description: "(opcional, só no modo test) link de um produto para testar"
        default: ""
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: promo-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre o main mais recente na hora de rodar (inclui o estado salvo pela execucao anterior)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          DI_EMAIL: ${{ secrets.DI_EMAIL }}
          DI_SENHA: ${{ secrets.DI_SENHA }}
          PROMO_MODE: ${{ github.event.inputs.mode || vars.PROMO_MODE || '' }}
          PROMO_TESTE_LINK: ${{ github.event.inputs.link || '' }}
          GH_TOKEN: ${{ github.token }}
          # 27/11: alerta de cadastro (post dos canais que bate com cadastro de cliente) -- antes estas 4 nao
          # eram passadas ao robo e o alerta ficava mudo
          CADASTRO_CANAIS_URL: ${{ secrets.CADASTRO_CANAIS_URL }}
          CADASTRO_CANAIS_CHAVE: ${{ secrets.CADASTRO_CANAIS_CHAVE }}
          BOT_MONITOR_TOKEN: ${{ secrets.BOT_MONITOR_TOKEN }}
          CHAT_MONITOR_ID: ${{ secrets.CHAT_MONITOR_ID }}
          # 27/11: bot de DICAS DE POSTAGEM (alerta de menor preco). Sem ele, o alerta vai pro monitora.
          BOT_DICAS_TOKEN: ${{ secrets.BOT_DICAS_TOKEN }}
          CHAT_DICAS_ID: ${{ secrets.CHAT_DICAS_ID }}
        run: python -m promo_bot.main
      - name: Salvar estado
        if: always()
        run: |
          mkdir -p state
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add state/estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estado" && (git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X theirs --no-edit)) && git push)
