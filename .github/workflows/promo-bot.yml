name: promo-bot
# TESTE: só roda manualmente. (Depois do teste, o cron será ligado.)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "off | dry | test | live"
        default: "dry"
      link:
        description: "(opcional, só no modo test) link de um produto para testar"
        default: ""
  # schedule:
  #   - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: promo-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          DI_EMAIL: ${{ secrets.DI_EMAIL }}
          DI_SENHA: ${{ secrets.DI_SENHA }}
          PROMO_MODE: ${{ github.event.inputs.mode || vars.PROMO_MODE || '' }}
          PROMO_TESTE_LINK: ${{ github.event.inputs.link || '' }}
        run: python -m promo_bot.main
      - name: Salvar estado
        if: always()
        run: |
          mkdir -p state
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add state/estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estado" && git pull --rebase && git push)
