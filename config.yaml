# ============================================================
# CONFIGURAÇÃO DO ROBÔ DE PROMOÇÕES (fumotom + promotom + juaocupons -> @divulgadorinteligente2bot)
# ============================================================
# mode:
#   off   = NADA roda (estado atual: desativado)
#   dry   = lê os canais e só escreve no log o que FARIA (não fala com o Divulgador)
#   test  = fala com o @di48291bot, preenche tudo e CANCELA no fim (nunca gera/posta)
#   live  = gera a promoção de verdade (vai para WhatsApp e Telegram)
mode: "live"

canais:
  - fumotom
  - promotom
  - juaocupons        # novo (t.me/juaocupons)
  - teniscertocupons  # vestuário/tênis (Netshoes, Asics, Olympikus, Centauro) ~369 mil inscritos
  - iuriindica        # eletrônicos e eletrodomésticos ~107 mil inscritos
  - perfumepromo      # beleza/perfumes (Época, Amobeleza) ~5 mil inscritos
  - pincei            # Pincei Ofertas (links pincei.co -> Mercado Livre) ~11 mil inscritos
  - apromodaluh       # A Promo da Luh (também no Monitorar Grupos; o robô não repete o que já saiu no grupo)
  - promosdaluh       # Promos da Luh (t.me/promosdaluh)

bot_divulgador: "divulgadorinteligente2bot"

# robô de cupons que recebe o aviso "/cupomacabou CODIGO" quando um canal avisa que o cupom esgotou
# (ele pergunta para você se posta que acabou ou não)
robo_cupons: "AchadosFutricaBot"
avisar_esgotado: true

# cupom do post: cadastra/atualiza na página de cupons do Divulgador (desconto, acima de, máximo, código)
# precisa dos secrets DI_EMAIL e DI_SENHA no GitHub (sem eles, só pula esta parte)
cupons_no_divulgador: true

# Mercado Livre: põe "📌 Vendido por Loja ..." na informação extra
ml_vendedor_extra: true

# lojas aceitas (false = o post é pulado e anotado no log)
lojas:
  amazon: true
  mercadolivre: true   # LIGADO 20/11 (com "📌 Vendido por" na informação extra)
  shopee: true         # LIGADO 20/11 (clique de teste confirmado no relatório)
  magalu: false
  aliexpress: false    # você pediu para NÃO gerar AliExpress
  # --- outras lojas (20/11): o link vai ao Divulgador, que converte no seu afiliado
  belezanaweb: true
  cea: true
  natura: true
  paguemenos: true
  casasbahia: true
  webcontinental: true
  nespresso: true
  amobeleza: true
  dafiti: true
  adidas: true
  carrefour: true
  artwalk: true
  asics: true
  authenticfeet: true
  puma: true
  brastemp: true
  drogal: true
  pacheco: true
  drogariasaopaulo: true
  drogaraia: true
  drogasil: true
  efacil: true
  hering: true          # Hering e Espaço Hering
  fastshop: true
  kabum: true
  lg: true
  mizuno: true
  olympikus: true
  stanley: true
  vivara: true
  nike: true
  netshoes: true
  centauro: true
  epocacosmeticos: true
  zzmall: true
  futfanatics: true     # o Divulgador não tem Futfanatics: se ele não gerar, você recebe aviso

# se o bot do Divulgador perguntar por qual plataforma gerar, usa esta
plataforma:
  belezanaweb: awin
  amobeleza: rakuten
  adidas: awin
  carrefour: awin
  dafiti: awin
  pacheco: rakuten
  drogariasaopaulo: rakuten
  drogasil: awin
  efacil: awin
  hering: rakuten       # Espaço Hering via Rakuten
  kabum: awin
  _padrao: [awin, rakuten, afilio]

# copia do post original as linhas de instrução (frete grátis, ative o cupom, cashback...) para a informação extra
copiar_extra: true

# posts que são PULADOS mesmo com loja ligada
bloquear_sacola_laranja: true   # qualquer post com 🛍 (sacola)
sacola_liberada_canais: [pincei]   # o Pincei usa a sacola em todo post (PEGAR PROMOCAO), nao e anuncio
bloquear_texto:                 # se o texto tiver qualquer uma destas frases (sem acento, minúsculas)
  - aliexpress
  - usado             # 23/11: sempre pular produtos usados
  - seminovo
  - recondicionado

preco:
  centavos_quando_inteiro: "00"   # 21/11: sem casa decimal = reais inteiros (1889 vira 1889,00)
  suspeito_abaixo_de: 10          # só marca no log como "bug"; você mandou rodar
  politica_suspeito: "publicar"   # publicar | pular

limites:
  max_por_execucao: 8             # no máximo N promoções por execução
  pausa_entre_promocoes_seg: 25   # pausa entre uma promoção e outra (evita bloqueio da conta)
  max_por_dia: 150
  primeira_vez_ler_ultimos: 0     # ao ligar, NÃO posta o passado (0). Coloque 5 para ler os 5 últimos.
  max_idade_min: 90               # posts com mais de 90 min são ignorados (evita postar promoção vencida)
  max_por_canal: 3                # no máximo N de cada canal por execução (o fumotom não ocupa tudo)
  fila_max: 200                   # promoções boas que sobraram esperam a próxima execução

# INTELIGÊNCIA: nota para cada promoção com base no que VOCÊ posta (seu grupo do Telegram, últimos 7 dias)
# as de nota maior saem primeiro; abaixo de nota_minima são puladas (aparece no log)
inteligencia:
  ligada: true
  meu_grupo: -1004468673194       # grupo "Achados Futrica" (onde o Divulgador posta)
  dias_perfil: 7
  atualizar_horas: 24
  nota_minima: 5
  bug_desconto: 0.6               # 60% ou mais de desconto = BUG (+20 na nota)

# promoções que VOCÊ gera à mão no @di48291bot não viram arte no robô de stories:
# o robô encaminha essas mensagens ao @achadosfutricatemplatesbot (é o "encaminhar para pular" automático).
# O que sai pelo @divulgadorinteligente2bot continua virando arte normalmente.
templates:
  ligado: false   # 21/11 DESLIGADO: encaminhava posts montados ao robo de stories
  bot_manual: di48291bot
  robo_templates: achadosfutricatemplatesbot

# não posta o MESMO produto 2x em 24 h (robô + seu grupo), a não ser que o preço caia 15% ou mais
repetidos:
  ligado: true
  horas: 24
  desconto_min: 0.15

# bônus na nota para lojas novas (as 4 grandes não ganham bônus)
bonus_loja:
  _novas: 15

# palavras que BLOQUEIAM (componentes de computador)...
bloquear:
  - hd
  - ssd
  - nvme
  - m.2
  - placa de video
  - placa mae
  - placa-mae
  - gpu
  - rtx
  - gtx
  - radeon
  - cooler
  - aircooler
  - water cooler
  - gabinete
  - fonte de alimentacao
  - fonte atx
  - memoria ram
  - ddr4
  - ddr5
  - processador
  - ryzen
  - intel core
  - kit upgrade
  - pasta termica
  - ventoinha
  - fan rgb
# ...exceto se o título tiver uma destas palavras (sempre passam)
liberar:
  - monitor
  - mouse
  - teclado
  - fone
  - headset
  - headphone
  - earphone
  - earbuds

# textos a remover das promoções copiadas
remover_linhas_que_comecam:
  - "-anuncio"
  - "anuncio"
remover_trechos:
  - "- Dica *"

# VIGIA DE CUPONS (21/11): fica ligado o dia todo pela sua conta do Telegram. Quando um destes canais
# posta cupom, chama o radar do @AchadosFutricaBot na hora ("/canais ja", apagado logo depois).
# Madrugada (00:30 às 07:00): vigia desligado e as promoções rodam a cada 30 min.
vigia:
  ligado: true
  canais: [juaocupons, promotom, fadadoscupons, pincei, promodecorridaoficial, promozoneoficial]
  espera_seg: 15        # espera o post aparecer na página pública antes de chamar o radar
  poll_seg: 20          # leitura de segurança (canal em que a conta não está inscrita)
  duracao_min: 330      # cada execução do GitHub fica ligada ~5h30 e a próxima assume
  ciclo_min: 10         # promoções (fumotom, promotom...) continuam a cada 10 min
  noite_inicio: "00:30"
  noite_fim: "07:00"
  noite_ciclo_min: 30
